<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automation Hub</title>

    <!-- Tab ka icon (chhota bijli ka nishaan), bina alag file ke -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%236366f1' d='M13 2 4 14h6l-1 8 9-12h-6z'/%3E%3C/svg%3E">

    <!-- Inter font (Google Fonts). Na mile toh system font use hoga -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!-- Peeche ke halke rangeen gradient blobs (sirf sajawat) -->
<div class="bg" aria-hidden="true"></div>

<!-- ============ LOGIN SCREEN ============ -->
<main id="login-view" class="login">
    <section class="login-card">
        <div class="brand brand--large">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        </span>
            <span class="brand-name">Automation Hub</span>
        </div>

        <h1 class="login-title">Welcome back</h1>
        <p class="muted">Sign in to manage your scheduled messages.</p>

        <form id="login-form" novalidate>
            <label class="field">
                <span>Username</span>
                <input id="username" type="text" autocomplete="username" required autofocus>
            </label>

            <label class="field">
                <span>Password</span>
                <div class="input-wrap">
                    <input id="password" type="password" autocomplete="current-password" required>
                    <button type="button" id="toggle-password" class="link-btn">Show</button>
                </div>
            </label>

            <p id="login-error" class="form-error hidden" role="alert"></p>

            <button id="login-submit" class="btn btn-primary btn-block" type="submit">
                <span class="btn-label">Sign in</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </form>
    </section>
</main>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard-view" class="dashboard hidden">
    <header class="topbar">
        <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>
        </span>
            <span class="brand-name">Automation Hub</span>
        </div>
        <div class="topbar-right">
            <div class="user-chip">
                <span id="user-avatar" class="avatar"></span>
                <span id="user-name" class="user-name"></span>
            </div>
            <button id="logout-btn" class="btn btn-ghost" type="button">Sign out</button>
        </div>
    </header>

    <div class="container">
        <section class="page-head">
            <h1>Dashboard</h1>
            <p class="muted">Your scheduled messages at a glance.</p>
        </section>

        <section id="stats" class="stats"></section>

        <section class="section-head">
            <h2>Your jobs</h2>
            <span id="jobs-count" class="count-pill"></span>
            <button id="new-job-btn" class="btn btn-primary btn-sm push-right" type="button">+ New job</button>
        </section>

        <section id="jobs" class="jobs-grid"></section>
    </div>
</div>


<!-- ============ NEW / EDIT JOB FORM ============ -->
<dialog id="job-dialog" class="dialog dialog--wide">
    <form id="job-form" novalidate>
        <div class="dialog-head">
            <h3 id="job-dialog-title">New job</h3>
            <button type="button" id="job-close" class="icon-btn" aria-label="Close">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </div>

        <label class="field">
            <span>Name</span>
            <input id="job-name" type="text" maxlength="100" placeholder="Morning goal reminder">
            <small class="field-error" data-error-for="name"></small>
        </label>

        <label class="field">
            <span>Message</span>
            <textarea id="job-message" rows="3" maxlength="1000" placeholder="What should be sent?"></textarea>
            <small class="field-hint"><span id="message-count">0</span>/1000</small>
            <small class="field-error" data-error-for="message"></small>
        </label>

        <div class="field-row">
            <label class="field">
                <span>Channel</span>
                <select id="job-channel"></select>
                <small class="field-error" data-error-for="channel"></small>
            </label>

            <!-- Sirf EMAIL channel chunne par dikhta hai -->
            <label class="field hidden" id="target-field">
                <span>Send to (email)</span>
                <input id="job-target" type="email" placeholder="you@example.com">
                <small class="field-error" data-error-for="target"></small>
            </label>
        </div>

        <fieldset class="schedule">
            <legend>Schedule (IST)</legend>

            <div class="field-row">
                <label class="field">
                    <span>Repeat</span>
                    <select id="schedule-mode">
                        <option value="daily">Every day</option>
                        <option value="weekdays">Weekdays (Mon to Fri)</option>
                        <option value="days">Specific days</option>
                        <option value="minutes">Every N minutes</option>
                        <option value="hours">Every N hours</option>
                        <option value="custom">Custom cron</option>
                    </select>
                </label>

                <label class="field" id="time-field">
                    <span>At</span>
                    <input id="schedule-time" type="time" value="08:00">
                </label>

                <label class="field hidden" id="interval-field">
                    <span id="interval-label">Every</span>
                    <input id="schedule-interval" type="number" min="1" max="59" value="15">
                </label>
            </div>

            <div id="days-field" class="days hidden" role="group" aria-label="Days of the week"></div>

            <label class="field hidden" id="custom-field">
                <span>Cron expression</span>
                <input id="schedule-custom" type="text" placeholder="0 0 8 * * *" spellcheck="false">
            </label>

            <div class="schedule-preview">
                <span id="schedule-text"></span>
                <code id="schedule-cron"></code>
            </div>
            <small class="field-error" data-error-for="cronExpression"></small>
        </fieldset>

        <p id="job-form-error" class="form-error hidden" role="alert"></p>

        <div class="dialog-actions">
            <button type="button" id="job-cancel" class="btn btn-ghost">Cancel</button>
            <button id="job-save" class="btn btn-primary" type="submit">
                <span class="btn-label">Create job</span>
                <span class="spinner" aria-hidden="true"></span>
            </button>
        </div>
    </form>
</dialog>



<!-- ============ DELETE CONFIRM (native <dialog>) ============ -->
<dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
        <h3>Delete this job?</h3>
        <p class="muted">
            <strong id="confirm-name"></strong> and its run history will be removed permanently.
        </p>
        <div class="dialog-actions">
            <button class="btn btn-ghost" value="cancel">Cancel</button>
            <button class="btn btn-danger" value="confirm">Delete</button>
        </div>
    </form>
</dialog>

<!-- Chhote notifications (toasts) yahan aate hain -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/js/app.js" defer></script>
</body>
</html>
