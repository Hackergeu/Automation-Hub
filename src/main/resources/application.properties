spring.application.name=automation-hub


telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}

# Database connection. Username/password environment variable se aate hain (secret hain)
spring.datasource.url=jdbc:mysql://localhost:3306/automation_hub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update = table nahi hai toh bana do, hai toh waise hi rehne do
spring.jpa.hibernate.ddl-auto=update

# Console mein dikhao ki Hibernate kaun si SQL chala raha hai (seekhne ke liye achha hai)
spring.jpa.show-sql=true


