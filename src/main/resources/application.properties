spring.application.name=automation-hub


telegram.bot-token=${TELEGRAM_BOT_TOKEN}
telegram.chat-id=${TELEGRAM_CHAT_ID}

# Database connection. Username/password environment variable se aate hain (secret hain)
spring.datasource.url=jdbc:mysql://localhost:3306/automation_hub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update = table nahi hai toh bana do, hai toh waise hi rehne do
spring.jpa.hibernate.ddl-auto=update

# Console mein dikhao ki Hibernate kaun si SQL chala raha hai (seekhne ke liye achha hai)
spring.jpa.show-sql=true

# Kul kitni baar try karna hai (pehli koshish mila ke)
retry.max-attempts=3

# Pehli retry se pehle kitna wait (milliseconds). Har baar double hota hai: 1s, 2s, 4s...
retry.initial-delay-ms=1000

# Discord webhook (secret). Khali ho toh DISCORD channel "not configured" maana jayega
discord.webhook-url=${DISCORD_WEBHOOK_URL:}

# Gmail SMTP. Username/password environment variables se aate hain (secret)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Timeouts, warna net atakne par thread latak sakta hai
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Login credentials. Environment variables se aate hain. Default nahi diya hai, isliye
# variable na ho toh app start hi nahi hogi (bina password ke chalne se behtar)
app.security.username=${APP_USERNAME}
app.security.password=${APP_PASSWORD}

# Actuator: sirf health endpoint expose karo, baaki sab band
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never